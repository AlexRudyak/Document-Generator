<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>היסטוריית מסמכים</title>
    <script>if (location.hostname === 'localhost') location.replace(location.href.replace('//localhost', '//127.0.0.1'));</script>
    <!-- Applied before the stylesheet renders so there's no flash of the wrong theme. -->
    <script>(function(){var t=localStorage.getItem('theme');if(!t)t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';document.documentElement.setAttribute('data-theme',t);})();</script>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body { font-family: 'Heebo', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 20px auto; padding: 40px; background: var(--surface); border-radius: 16px; box-shadow: 0 10px 25px var(--shadow-sm); }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid var(--surface-muted); padding-bottom: 20px; gap: 12px; flex-wrap: wrap; }
        .header-row h1 { margin: 0; font-size: 32px; color: var(--text-strong); }
        .header-row-actions { display: flex; gap: 10px; }

        /* Modern Buttons */
        .btn-modern {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            background: var(--border);
            color: var(--text-muted);
            border: none;
            display: inline-flex;
            align-items: center;
        }
        .btn-modern:hover { background: var(--border-strong); }

        /* Modern Search Input */
        .search-container { position: relative; margin-bottom: 30px; }
        .search-container input {
            width: 100%;
            padding: 18px 24px;
            font-size: 18px;
            font-family: 'Heebo', sans-serif;
            border: 2px solid var(--border);
            border-radius: 12px;
            background: var(--surface-alt);
            color: var(--text-strong);
            box-sizing: border-box;
            transition: all 0.2s ease;
        }
        .search-container input:focus {
            border-color: var(--accent);
            outline: none;
            background: var(--surface);
            box-shadow: 0 0 0 4px var(--accent-shadow);
        }

        /* Modern Table */
        .history-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .history-table th { background-color: var(--surface-muted); padding: 16px; text-align: right; color: var(--text-muted); font-weight: 600; border-bottom: 2px solid var(--border); }
        .history-table td { padding: 16px; border-bottom: 1px solid var(--border); font-size: 16px; color: var(--text); }
        .history-table tr { transition: background-color 0.15s; }
        .history-table tr:hover { background-color: var(--surface-alt); cursor: pointer; }
        .checkbox-cell { width: 44px; }
        .row-checkbox, #select-all-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--accent);
        }

        /* Bulk delete bar */
        .bulk-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding: 12px 18px;
            background: var(--accent-soft);
            border: 1px solid var(--accent-soft-border);
            border-radius: 10px;
        }
        .bulk-bar[hidden] { display: none; }
        .bulk-bar-count { font-weight: 700; color: var(--text-strong); flex: 1; }
        .btn-danger-soft { background: var(--danger-soft); color: var(--danger); }
        .btn-danger-soft:hover { background: var(--danger-soft-hover); }

        /* Per-row actions: redownload the PDF, or (when relevant) a copy
           with the yellow revision diff highlighting stripped. */
        .row-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
        .btn-row-action {
            padding: 4px 10px;
            border: 1px solid var(--accent-soft-border);
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent-strong);
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }
        .btn-row-action:hover { background: var(--accent-soft-hover); }

        /* Badges */
        .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
        .badge-id { background: var(--accent-soft); color: var(--accent-strong); }
        .badge-rev { background: var(--warning-soft-bg); color: var(--warning-soft-text); }
        .badge-date { background: var(--surface-muted); color: var(--text-muted); }

        .no-results { text-align: center; padding: 40px; color: var(--text-faint); font-size: 18px; font-weight: 600; }

        /* Flex Alignment */
        .flex-col { display: flex; flex-direction: column; gap: 4px; }
        .text-sm { font-size: 14px; color: var(--text-muted); }
        .doc-title-strong { color: var(--text-heading); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-row">
            <h1>היסטוריית מסמכים</h1>
            <div class="header-row-actions">
                <button id="theme-toggle-btn" class="btn-modern theme-toggle" title="החלף מצב תצוגה"></button>
                <a href="/" class="btn-modern">&rarr; חזרה לעורך</a>
            </div>
        </div>

        <div class="search-container">
            <input type="text" id="search-input" placeholder="חיפוש לפי שם מסמך, מזהה (UID), או תוכן...">
        </div>

        <div class="bulk-bar" id="bulk-bar" hidden>
            <span class="bulk-bar-count" id="bulk-bar-count"></span>
            <button type="button" id="bulk-clear-btn" class="btn-modern">בטל בחירה</button>
            <button type="button" id="bulk-delete-btn" class="btn-modern btn-danger-soft">🗑 מחק נבחרים</button>
        </div>

        <table class="history-table">
            <thead>
                <tr>
                    <th class="checkbox-cell"><input type="checkbox" id="select-all-checkbox" title="בחר הכל"></th>
                    <th width="36%">שם המסמך</th>
                    <th width="20%">מזהה ייחודי (UID)</th>
                    <th width="15%">מספר מהדורה</th>
                    <th width="25%">תאריך עדכון</th>
                </tr>
            </thead>
            <tbody id="history-tbody">
                <!-- Dynamically populated -->
            </tbody>
        </table>
    </div>

    <footer class="app-credit">
        נוצר על ידי <strong>Alexander Rudyak</strong>
        <span class="dot">·</span>
        באמצעות <a href="https://claude.com/claude-code" target="_blank" rel="noopener">Claude</a>
    </footer>

    <script>
        (function initThemeToggle() {
            const btn = document.getElementById('theme-toggle-btn');
            const sync = () => {
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                btn.innerText = isDark ? '☀️' : '🌙';
                btn.title = isDark ? 'עבור למצב בהיר' : 'עבור למצב כהה';
            };
            sync();
            btn.addEventListener('click', () => {
                const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
                sync();
            });
        })();

        let searchTimeout = null;
        const selectedIds = new Set();

        // Defense in depth: schema validation already rejects "<"/">" in the
        // fields interpolated below (title comes from block text, document
        // number from custom_doc_id), but a raw template literal into
        // innerHTML would still be one bug away from stored XSS otherwise.
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str == null ? '' : String(str);
            return div.innerHTML;
        }

        function updateBulkBar() {
            const bar = document.getElementById('bulk-bar');
            const rowBoxes = document.querySelectorAll('.row-checkbox');
            const selectAll = document.getElementById('select-all-checkbox');

            bar.hidden = selectedIds.size === 0;
            document.getElementById('bulk-bar-count').textContent = `${selectedIds.size} מסמכים נבחרו`;

            selectAll.checked = rowBoxes.length > 0 && selectedIds.size === rowBoxes.length;
            selectAll.indeterminate = selectedIds.size > 0 && selectedIds.size < rowBoxes.length;
        }

        function renderDocuments(docs) {
            const tbody = document.getElementById('history-tbody');
            tbody.innerHTML = '';
            selectedIds.clear();

            if (docs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5"><div class="no-results">לא נמצאו מסמכים תואמים.</div></td></tr>';
                updateBulkBar();
                return;
            }

            docs.forEach(doc => {
                const tr = document.createElement('tr');
                tr.onclick = () => {
                    window.location.href = `/?doc_id=${doc.id}`;
                };

                // The list API already extracts the title from the content JSON.
                const docTitle = escapeHtml(doc.title || doc.document_number);
                const docNumber = escapeHtml(doc.document_number);
                const uniqueId = escapeHtml(doc.unique_identifier);
                const dateStr = doc.created_date
                    ? new Date(doc.created_date).toLocaleString('he-IL')
                    : '---';

                tr.innerHTML = `
                    <td class="checkbox-cell"><input type="checkbox" class="row-checkbox" data-id="${doc.id}"></td>
                    <td>
                        <div class="flex-col">
                            <strong class="doc-title-strong">${docTitle}</strong>
                            <span class="text-sm">מספר סידורי: ${docNumber}</span>
                            <div class="row-actions">
                                <button type="button" class="btn-row-action" data-action="download">⬇ הורד PDF</button>
                                ${doc.has_highlights
                                    ? `<button type="button" class="btn-row-action" data-action="download-clean">🧹 הורד ללא סימון שינויים</button>`
                                    : ''}
                            </div>
                        </div>
                    </td>
                    <td>
                        ${doc.unique_identifier ? `<span class="badge badge-id">${uniqueId}</span>` : '<span class="text-sm">---</span>'}
                    </td>
                    <td><span class="badge badge-rev">Rev ${doc.revision_number}</span></td>
                    <td><span class="badge badge-date">${dateStr}</span></td>
                `;

                const cb = tr.querySelector('.row-checkbox');
                cb.addEventListener('click', (e) => e.stopPropagation());
                cb.addEventListener('change', () => {
                    if (cb.checked) selectedIds.add(doc.id); else selectedIds.delete(doc.id);
                    updateBulkBar();
                });

                tr.querySelectorAll('.btn-row-action').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const query = btn.dataset.action === 'download-clean' ? '?highlight=0' : '';
                        window.location.href = `/api/documents/${doc.id}/pdf${query}`;
                    });
                });

                tbody.appendChild(tr);
            });

            updateBulkBar();
        }

        function fetchDocuments(query = '') {
            fetch(`/api/documents?q=${encodeURIComponent(query)}`)
                .then(res => res.json())
                .then(data => renderDocuments(data))
                .catch(err => console.error("Failed to load documents:", err));
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                fetchDocuments(e.target.value.trim());
            }, 300);
        });

        document.getElementById('select-all-checkbox').addEventListener('change', (e) => {
            const checked = e.target.checked;
            document.querySelectorAll('.row-checkbox').forEach(cb => {
                cb.checked = checked;
                const id = parseInt(cb.dataset.id, 10);
                if (checked) selectedIds.add(id); else selectedIds.delete(id);
            });
            updateBulkBar();
        });

        document.getElementById('bulk-clear-btn').addEventListener('click', () => {
            selectedIds.clear();
            document.querySelectorAll('.row-checkbox').forEach(cb => { cb.checked = false; });
            updateBulkBar();
        });

        document.getElementById('bulk-delete-btn').addEventListener('click', async () => {
            const ids = Array.from(selectedIds);
            if (ids.length === 0) return;
            if (!confirm(`למחוק ${ids.length} מסמכים? לא ניתן לשחזר לאחר המחיקה.`)) return;

            try {
                const res = await fetch('/api/documents', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ids }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'מחיקה נכשלה');
                fetchDocuments(document.getElementById('search-input').value.trim());
            } catch (err) {
                alert('מחיקה נכשלה: ' + err.message);
            }
        });

        // Initial Load
        fetchDocuments();
    </script>
</body>
</html>
